<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" id="meta-color-scheme" />
    <meta name="description" content="A faster bang redirect." />
    <link rel="icon" type="image/svg+xml" id="favicon" href="/search.svg" />
    <!-- Apply theme before first paint to avoid flash -->
    <script>
      (function(){
        var s=localStorage.getItem("theme");
        var l=s?s==="light":window.matchMedia('(prefers-color-scheme: light)').matches;
        var h=document.documentElement;
        var m=document.getElementById("meta-color-scheme");
        h.style.background=l?"#f4f9f8":"#191c1c";
        h.style.colorScheme=l?"light":"dark";
        if(m)m.content=l?"light dark":"dark light";
        h.dataset.theme=l?"light":"dark";
        if(l){var fav=document.getElementById("favicon");if(fav)fav.href="/search-light.svg";}
      })();
    </script>
    <style>html,body{background:#191c1c}@media(prefers-color-scheme:light){html,body{background:#f4f9f8}}html[data-theme="light"],html[data-theme="light"] body{background:#f4f9f8}html[data-theme="dark"],html[data-theme="dark"] body{background:#191c1c}</style>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <title>Unq**ck</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
